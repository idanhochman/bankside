# The opendv target for {{module}}. Owner: DV.
# Add the module to the root opendv.yaml's targets only once dv/tests holds a
# test: opendv refuses a target without one, and that fails the whole project.
version: 1
name: {{module}}
toplevel: {{module}}

rtl:
  filelist: rtl/{{module}}.f

dv:
  tests: [test_*]
