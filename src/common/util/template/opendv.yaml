# The opendv target for {{module}}. Owner: DV.
# List it in the root opendv.yaml's targets from the start: until dv/tests holds
# a test, `opendv lint` checks it and `opendv regress` skips it.
version: 1
name: {{module}}
toplevel: {{module}}

rtl:
  filelist: rtl/{{module}}.f

dv:
  tests: [test_*]
